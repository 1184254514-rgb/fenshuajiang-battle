name: 复刻差异与验收
description: 记录具体差异、原版依据、实现与验收结果
title: "[复刻] "
labels: ["复刻差异"]
body:
  - type: markdown
    attributes:
      value: "范围：Windows 离线当前四分钟模式。每项聚焦可独立验收的结论；资源存在、按钮存在、测试通过均不等于原版验收。提交后同步同名标签和 Project 字段；本表不会自动设置 Project。"
  - type: dropdown
    id: implementation
    attributes:
      label: 实现状态
      options: ["未实现", "部分实现", "已实现待对照", "已验收"]
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: 证据分类
      options: ["已有原版证据", "本地适配", "证据不足"]
    validations:
      required: true
  - type: textarea
    id: difference
    attributes:
      label: 当前差异与范围
      description: 源码提交、发布基线、原版行为、本地行为及本轮明确边界
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: 原版依据、冲突与缺口
      description: 录像来源/版本/时间点，原包摘要/文件/函数地址，配置项及能支持的具体结论；列明冲突、假设与缺资源
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 相同输入和环境下的可观察结果；用户指定规则、本地适配使用其明确标准
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 实际验证与交付关联
      description: 源码提交、实际命令和结果、EXE 操作、完整日志、截图/录屏、Release 与 SHA256；注明注入场景，尚未执行写未执行
    validations:
      required: true
  - type: textarea
    id: remaining
    attributes:
      label: 剩余差异与下一步
      description: 未对照项目继续保持待验收；验收时记录依据、条件、结论与验收人/日期
    validations:
      required: true
